name: Build PlayerCannon

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Find project folder (pom.xml)
        id: proj
        run: |
          POM=$(find . -type f -name pom.xml -not -path '*/target/*' -not -path './.git/*' -print -quit)
          if [ -z "$POM" ]; then
            echo "FEHLER: Keine pom.xml gefunden! Bitte pom.xml ins Repository hochladen."
            exit 1
          fi
          DIR=$(dirname "$POM")
          echo "Projekt gefunden in: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Prepare folder structure
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          place() {
            NAME="$1"
            TARGET="$2"
            if [ -f "$TARGET" ]; then
              echo "OK (Ordner schon richtig): $TARGET"
              return
            fi
            FOUND=$(find "$GITHUB_WORKSPACE" -type f -name "$NAME" -not -path '*/target/*' -not -path '*/.git/*' -print -quit)
            if [ -z "$FOUND" ]; then
              echo "FEHLER: $NAME wurde nirgendwo im Repository gefunden. Bitte hochladen."
              exit 1
            fi
            mkdir -p "$(dirname "$TARGET")"
            cp "$FOUND" "$TARGET"
            echo "Ordner angelegt, kopiert: $FOUND -> $TARGET"
          }
          place PlayerCannon.java src/main/java/de/playercannon/PlayerCannon.java
          place plugin.yml src/main/resources/plugin.yml
          place config.yml src/main/resources/config.yml
          echo "Dateien im Projekt:"
          find . -type f -not -path './.git/*' -not -path './target/*' | sort

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        working-directory: ${{ steps.proj.outputs.dir }}
        run: mvn -B clean package

      - name: Verify jar
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          unzip -l target/PlayerCannon.jar > jar-content.txt
          cat jar-content.txt
          grep -q "plugin.yml" jar-content.txt || { echo "FEHLER: plugin.yml fehlt in der Jar"; exit 1; }
          grep -q "config.yml" jar-content.txt || { echo "FEHLER: config.yml fehlt in der Jar"; exit 1; }
          grep -q "de/playercannon/PlayerCannon.class" jar-content.txt || { echo "FEHLER: PlayerCannon.class fehlt in der Jar"; exit 1; }
          echo "Jar ist in Ordnung."

      - name: Upload artifact (ist eine .zip, die .jar liegt darin)
        uses: actions/upload-artifact@v4
        with:
          name: PlayerCannon
          path: ${{ steps.proj.outputs.dir }}/target/PlayerCannon.jar
          if-no-files-found: error

      - name: Create release with direct jar
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Build {0}', github.run_number) }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          files: ${{ steps.proj.outputs.dir }}/target/PlayerCannon.jar
          generate_release_notes: true
